system:
  name: "TSLA Stock Trader V4.3"
  version: "4.3.0"
  seed: 42

asset:
  symbol: "TSLA"
  alpaca_symbol: "TSLA"
  asset_type: "stock"
  data_provider: "alpaca"
  base_timeframe: "1h"
  htf_timeframe: "1d"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  history_years: 2

strategy:
  name: "trend_pullback"
  params:
    htf_ema_period: 50
    htf_slope_lookback: 3
    ltf_rsi_period: 14
    ltf_rsi_oversold: 42
    ltf_ema_fast: 20
    ltf_ema_slow: 50
    atr_period: 14
    sl_atr_multiplier: 1.5
    tp_atr_multiplier: 3.5

exit_rules:
  enable_trailing_stop: true
  trailing_trigger_pct: 0.015
  trailing_dist_pct: 0.012

volatility_regime:
  window: 24
  calm_quantile: 0.33
  high_quantile: 0.67
  allowed_regimes: ["CALM", "NORMAL"]

risk_engine:
  initial_capital: 10000.0
  risk_per_trade_pct: 0.005
  max_daily_loss_pct: 0.010
  max_drawdown_limit_pct: 0.10
  cooldown_bars: 12

position_sizer:
  method: "fixed_risk"
  risk_pct: 0.005
  min_qty: 1.0

execution:
  provider: "alpaca"
  paper_trading: true
  commission_bps: 0
  slippage_bps: 2
