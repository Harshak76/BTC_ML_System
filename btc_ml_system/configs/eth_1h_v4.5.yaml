system:
  name: "ETH 1h Trader V4.5"
  version: "4.5.0"
  seed: 42

asset:
  symbol: "ETHUSDT"
  alpaca_symbol: "ETH/USD"
  asset_type: "crypto"
  data_provider: "binance"
  base_timeframe: "1h"               # Strictly 1h
  htf_timeframe: "4h"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  history_years: 2

strategy:
  name: "crypto_regime_momentum"
  params:
    htf_ema_period: 50
    htf_slope_lookback: 3
    bb_period: 20
    bb_std_mult: 2.0
    max_bb_bandwidth: 0.05
    rsi_period: 14
    min_rsi: 52.0
    atr_period: 14
    sl_atr_multiplier: 1.5
    tp_atr_multiplier: 3.5

multi_timeframe_filter:
  enabled: false
  strength: "Medium"
  ema_fast: 50
  ema_slow: 200

session_filter:
  enabled: true
  start_hour: 14
  end_hour: 22

dynamic_risk_sizer:
  enabled: false
  base_risk_pct: 0.0050
  min_risk_pct: 0.0040
  max_risk_pct: 0.0080
  performance_lookback: 15
  volatility_lookback: 50
  max_step_change: 0.0015
  win_rate_upside_threshold: 0.55
  win_rate_downside_threshold: 0.42
  volatility_spike_threshold: 1.30


exit_rules:
  enable_trailing_stop: false        # Reverted: Disable trailing stops for ETH 1h to avoid premature exits

volatility_regime:
  window: 24
  calm_quantile: 0.33
  high_quantile: 0.67
  allowed_regimes: ["CALM"]          # Strictly CALM regime

risk_engine:
  initial_capital: 10000.0
  risk_per_trade_pct: 0.005
  max_daily_loss_pct: 0.010
  max_drawdown_limit_pct: 0.10
  cooldown_bars: 12

position_sizer:
  method: "fixed_risk"
  risk_pct: 0.005
  min_qty: 0.01

execution:
  provider: "alpaca"
  paper_trading: true
  commission_bps: 10
  slippage_bps: 5
