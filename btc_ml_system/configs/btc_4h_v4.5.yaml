system:
  name: "BTC 4h Trader V4.5"
  version: "4.5.0"
  seed: 42

asset:
  symbol: "BTCUSDT"
  alpaca_symbol: "BTC/USD"
  asset_type: "crypto"
  data_provider: "binance"
  base_timeframe: "4h"
  htf_timeframe: "1d"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  history_years: 2

strategy:
  name: "btc_htf_trend"
  params:
    htf_ema_period: 50
    htf_slope_lookback: 3
    donchian_period: 20
    min_vol_ratio: 1.15
    ltf_rsi_period: 14
    ltf_rsi_oversold: 45
    ltf_ema_fast: 20
    ltf_ema_slow: 50
    atr_period: 14
    sl_atr_multiplier: 1.5
    tp_atr_multiplier: 3.5

multi_timeframe_filter:
  enabled: true
  strength: "Medium"
  ema_fast: 50
  ema_slow: 200

dynamic_risk_sizer:
  enabled: false
  base_risk_pct: 0.0050
  min_risk_pct: 0.0040
  max_risk_pct: 0.0080
  performance_lookback: 15
  volatility_lookback: 50
  max_step_change: 0.0015
  win_rate_upside_threshold: 0.55
  win_rate_downside_threshold: 0.42
  volatility_spike_threshold: 1.30


exit_rules:
  enable_trailing_stop: true
  trailing_trigger_pct: 0.025        # 2.5% profit trigger
  trailing_dist_pct: 0.020           # 2.0% trailing distance

volatility_regime:
  enabled: true
  window: 24
  calm_quantile: 0.33
  high_quantile: 0.67
  allowed_regimes: ["NORMAL"]

risk_engine:
  initial_capital: 10000.0
  risk_per_trade_pct: 0.005
  max_daily_loss_pct: 0.010
  max_drawdown_limit_pct: 0.10
  cooldown_bars: 6

position_sizer:
  method: "fixed_risk"
  risk_pct: 0.005
  min_qty: 0.001

execution:
  provider: "alpaca"
  paper_trading: true
  commission_bps: 10
  slippage_bps: 5
